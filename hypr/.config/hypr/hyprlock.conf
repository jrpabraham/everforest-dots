$transparent = rgba(0, 0, 0, 0)
$color = rgba(45,53,59, 1.0)
$inner_color = rgba(45,53,59, 0.8)
$outer_color = rgba(211,198,170, 1.0)
$font_color = rgba(211,198,170, 1.0)
$check_color = rgba(127,187,179, 1.0)

general {
	immediate_render = false
    ignore_empty_input = false
}

background {
    monitor =
    color = $color
    path = ~/Pictures/1749454874741614.jpg
    blur_passes = 2
    brightness = 0.5
}

animations {
    enabled = true

    bezier = snappy, 0.25, 0.1, 0.25, 1.0

    animation = fadeIn, 1, 0.1, snappy
    animation = fadeOut, 1, 0.1, snappy
    animation = inputFieldDots, 1, 0.1, snappy
}

label {
    monitor =
    position = 0, 0
    halign = center
    valign = center
    
    text = cmd[] shuf -n 1 ~/.config/hypr/quotes/heidegger_quotes.txt | fold -s -w 100
    font_family = EB Garamond
    color = $font_color
    text_align = center
    
    font_size = 16

}

input-field {
    monitor =
    size = 200, 40
    position = 0, -100
    halign = center
    valign = center

    inner_color = $transparent
    outer_color = $outer_color
    outline_thickness = 1

    font_family = Terminess Nerd Font Mono
    font_color = $font_color

    placeholder_text = Authenticate
    check_color = $check_color
    fail_text = Don't Try Again

    rounding = 8
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
