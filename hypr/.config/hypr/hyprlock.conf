$color = rgba(45,53,59, 1.0)
$inner_color = rgba(45,53,59, 0.8)
$outer_color = rgba(211,198,170, 1.0)
$font_color = rgba(211,198,170, 1.0)
$check_color = rgba(127,187,179, 1.0)

general {
	immediate_render = true
    ignore_empty_input = false
}

background {
    monitor =
    color = $color
    path = ~/Pictures/1749454874741614.jpg
    blur_passes = 2
}

animations {
    enabled = true

    bezier = snappy, 0.25, 0.1, 0.25, 1.0

    animation = fadeIn, 1, 0.25, snappy
    animation = fadeOut, 1, 0.25, snappy
    animation = inputFieldDots, 1, 0.1, snappy
}

input-field {
    monitor =
    size = 200, 40
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 1

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Authenticate
    check_color = $check_color
    fail_text = Don't Try Again

    rounding = 8
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
